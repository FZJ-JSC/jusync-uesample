; Overrides Engine/Config/BaseScalability.ini [AntiAliasingQuality@3], which sets
; r.TSR.History.ScreenPercentage=200. At 200 the TSR history is supersampled, and on this
; level's thin lattice geometry (rack shelves, wire) it caused strong per-frame edge shimmer.
[AntiAliasingQuality@3]
r.TSR.History.ScreenPercentage=100
